name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so the push event and the pull
# request event for one branch share a group instead of running the same checks
# twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # The version the Pipfile requires.
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"

      # Installed editable, as the Pipfile does, so that tests import the
      # package the same way a working copy does.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip install pytest

      - name: Run tests
        run: pytest
